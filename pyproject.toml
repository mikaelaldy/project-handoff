[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "handoff"
version = "0.1.0"
description = "Vendor-neutral memory and handoff layer for AI coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.optional-dependencies]
cockroach = ["psycopg[binary]>=3.1", "psycopg-pool>=3.2"]
aws = ["boto3>=1.34"]
mcp = ["mcp>=1.0"]
cli = ["rich"]
test = ["pytest>=8"]

[project.scripts]
handoff = "handoff.cli:run"
handoff-hooks = "handoff.adapters.hooks:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]